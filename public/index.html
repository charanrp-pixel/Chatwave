<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatWave | Secure Login</title>
  <meta name="description" content="Sign in to ChatWave. Professional, secure, and real-time messaging.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e1a;
      --panel: #0f1524;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f0f4ff;
      --text-muted: #8892b0;
      --accent: #6c63ff;
      --accent-hover: #5a52d5;
      --glass: rgba(255, 255, 255, 0.03);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      background-image: 
        radial-gradient(circle at top right, rgba(108, 99, 255, 0.05), transparent 40%),
        radial-gradient(circle at bottom left, rgba(167, 139, 250, 0.05), transparent 40%);
      -webkit-font-smoothing: antialiased;
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
      padding: 24px;
    }

    .login-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 40px;
    }

    .logo-container {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(108, 99, 255, 0.25);
    }

    .title {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      text-align: center;
    }

    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-google:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .btn-google:active {
      transform: translateY(0);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 28px 0;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    
    .divider::before { margin-right: 12px; }
    .divider::after { margin-left: 12px; }

    .features {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 24px;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .feature-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    .error-banner {
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 8px;
      padding: 12px;
      color: #fca5a5;
      font-size: 0.85rem;
      margin-bottom: 24px;
    }

    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    
    .footer a {
      color: var(--text-muted);
      text-decoration: underline;
      text-decoration-color: rgba(136, 146, 176, 0.4);
      text-underline-offset: 3px;
      transition: color 0.2s;
    }

    .footer a:hover {
      color: var(--text);
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="brand">
        <div class="logo-container">💬</div>
        <h1 class="title">Welcome to ChatWave</h1>
        <p class="subtitle">Secure, professional communication.</p>
      </div>

      <div class="error-banner" id="errorBanner">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        Authentication failed. Please try again.
      </div>

      <a href="/auth/google" class="btn-google" id="googleBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span>Sign in with Google</span>
      </a>

      <div class="divider">Features</div>

      <div class="features">
        <div class="feature-item">
          <div class="feature-dot"></div>
          Real-time
        </div>
        <div class="feature-item">
          <div class="feature-dot" style="background: #22c55e;"></div>
          Secure
        </div>
        <div class="feature-item">
          <div class="feature-dot" style="background: #3b82f6;"></div>
          Cloud Sync
        </div>
      </div>
    </div>

    <div class="footer">
      By signing in, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
    </div>
  </div>

  <script>
    if (new URLSearchParams(window.location.search).get('error') === 'auth_failed') {
      document.getElementById('errorBanner').style.display = 'flex';
    }
    fetch('/auth/me').then(r => r.json()).then(d => {
      if (d.user) window.location.href = d.user.username ? '/app.html' : '/setup.html';
    });
  </script>
</body>
</html>
